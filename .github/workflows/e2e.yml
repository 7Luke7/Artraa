name: E2E

# Runs the end-to-end suite against this commit of the application.
#
# The tests themselves live in a separate repository - 7Luke7/artra-e2e - and
# are checked out here at run time. That split is deliberate: the suite has its
# own dependencies, its own release cadence and its own CI, and vendoring it
# into the application would mean every application change dragged a Java
# toolchain along with it.
#
# What this gives you: every push to this repository gets a pass/fail mark from
# the full browser suite, and a pull request cannot be merged into main while
# that mark is red (once main is protected - see the repository's Settings ->
# Rules). A push itself cannot be rejected by CI; GitHub has already accepted
# the commit by the time a workflow starts.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers to run, comma-separated"
        default: "chrome,firefox,edge"
        type: string

# A new push supersedes the run already in flight for the same branch. A full
# matrix takes about eight minutes and there is no value in finishing one for a
# commit that has already been replaced.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite to test with. Pinned to a branch rather than a SHA on purpose:
  # the application should be tested against the current suite, so a new
  # regression test starts guarding this repository as soon as it is written.
  E2E_REPOSITORY: 7Luke7/artra-e2e
  E2E_REF: main

jobs:

  # Decides which browsers to run.
  #
  # The full matrix on main and on pull requests, where the result is a gate.
  # Chrome alone on a feature branch, where it is fast feedback and three jobs
  # per work-in-progress commit would be noise. A separate job because GitHub's
  # expression language has no way to split a string into a matrix.
  plan:
    name: Resolve browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.resolve.outputs.browsers }}
    steps:
      - id: resolve
        env:
          REQUESTED: ${{ inputs.browsers }}
          IS_GATE: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$REQUESTED" ]; then
            list="$REQUESTED"
          elif [ "$IS_GATE" = "true" ]; then
            list="chrome,firefox,edge"
          else
            list="chrome"
          fi
          json=$(printf '%s' "$list" | tr -d '[:space:]' \
            | awk -F, '{printf "["; for (i = 1; i <= NF; i++) if ($i != "") printf "%s\"%s\"", (i > 1 ? "," : ""), $i; printf "]"}')
          echo "Matrix: $json"
          echo "browsers=$json" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Chrome failing tells you nothing about Firefox. Finish the whole matrix.
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}

    steps:
      # The suite is the working directory: run.sh resolves everything else
      # relative to itself. No token needed - artra-e2e is public.
      - name: Check out the test suite
        uses: actions/checkout@v5
        with:
          repository: ${{ env.E2E_REPOSITORY }}
          ref: ${{ env.E2E_REF }}
          path: e2e

      # This commit of the application - the thing actually under test.
      - name: Check out this commit of the application
        uses: actions/checkout@v5
        with:
          path: app

      - name: Show what is being tested
        run: |
          echo "application : ${{ github.repository }}@${{ github.sha }}"
          echo "suite       : ${{ env.E2E_REPOSITORY }}@$(git -C e2e rev-parse --short HEAD)"
          echo "browser     : ${{ matrix.browser }}"

      # No secrets are configured, and none are needed: the stack generates its
      # own throwaway keys and captures every email in a disposable mail server
      # rather than sending any. A pull request from a fork can therefore run
      # the full suite without ever being handed a credential.
      #
      # run.sh exits with Maven's exit code, so a failed test fails this step,
      # this job, and the commit's status on this repository.
      - name: Run the suite against this commit
        working-directory: e2e
        env:
          ARTRA_PATH: ${{ github.workspace }}/app
        run: ./run.sh browsers=${{ matrix.browser }} sessions=2

      - name: Upload test results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.browser }}
          path: e2e/runs/
          if-no-files-found: warn
          retention-days: 14

      # Only on failure, and separate from the results: this is where an
      # infrastructure problem shows up, as opposed to a test problem.
      - name: Collect container logs
        if: failure()
        working-directory: e2e
        run: |
          mkdir -p container-logs
          docker compose logs --no-color --timestamps > container-logs/compose.log 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: container-logs-${{ matrix.browser }}
          path: e2e/container-logs/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: e2e
        run: |
          docker compose down --remove-orphans --volumes || true
          # The grid creates browser and recorder containers through the Docker
          # socket, so they sit outside the compose project and survive `down`
          # if a run was cancelled mid-session.
          docker ps -aq --filter 'name=^/browser-' | xargs -r docker rm -f || true
          docker ps -aq --filter 'name=^/recorder-' | xargs -r docker rm -f || true
